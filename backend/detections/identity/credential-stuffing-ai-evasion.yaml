id: credential-stuffing-ai-evasion
name: "AI-Evasion Credential Stuffing Pattern"
severity: high
category: identity
tags:
  - "mitre.attack.T1110"
  - "mitre.attack.T1110.004"
log_source: auth
enabled: true

# Detects the pattern documented for BruteForceAI's evasion mode (technique
# reference only, no code integrated): rapid sequential login attempts across
# multiple usernames, rotating User-Agent strings, and synchronized delays
# with jitter -- i.e. inter-attempt timing that is randomized but bounded,
# suggesting scripted evasion rather than human or naive-bot behavior.
detection:
  condition: "all"
  rules:
    - field: event_type
      op: equals
      value: login_failure
    - field: unique_usernames_attempted
      op: gte
      value: 5
    - field: user_agent_rotation_detected
      op: equals
      value: true
    - field: jitter_bounded
      op: equals
      value: true

false_positives: >
  Legitimate load-testing tools or credential-recovery bulk operations may also
  rotate User-Agents and space requests -- correlate with source reputation and
  business-hours context before auto-containing.
playbook: null
