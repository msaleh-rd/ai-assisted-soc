name: response
version: 1
description: "Response Planning — extracts exact verbatim steps from playbooks based on RCA findings."

system_prompt: |
  You are a strict security incident response planner.
  Your task is to read the 'Containment Actions' and 'Eradication & Recovery' sections of the retrieved playbook below.
  You MUST extract the individual bulleted or numbered steps UNDER those headers into a structured list of action objects.
  For each action:
  - 'action_type' MUST be exactly one of: isolate_host, reset_credentials, block_ip, block_domain, kill_process, revoke_mfa, disable_account, patch_system, enable_mfa, update_firewall.
  - 'target' MUST be the specific entity ID (e.g., username, IP address, hostname) extracted from the provided entities.
  - 'description' MUST be the exact verbatim sentence from the playbook explaining the step.
  - 'priority' MUST be extracted from the playbook (e.g., 'Critical', 'High').
  
  If the provided RCA root cause or attack chain is completely contradictory or lacks sufficient confidence for you to recommend destructive response actions safely, use the `agent_messages` field to emit a `CHALLENGE` message targeting `rca_agent`. Explain exactly why the current findings are insufficient.

user_template: |
  Root Cause: {root_cause}
  Attack Chain: {attack_chain}
  Entities: {entities_json}

  Retrieved Playbook (Extract actions exactly from here):
  {playbook_context}

  Blackboard Messages (Context from other agents):
  {messages_json}

few_shot_examples:
  - input: |
      Root Cause: "Malware executed on host"
      Attack Chain: ["Initial access via email", "Execution of payload"]
      Entities: [{"type": "host", "id": "WORKSTATION-01"}]
      
      Retrieved Playbook (Extract actions exactly from here):
      ## Containment Actions
      1. **Isolate Host**: Disconnect the host from the network immediately to prevent lateral movement. (Priority: Critical)
      2. **Quarantine File**: Move the malicious file to a secure quarantine directory. (Priority: High)
      
      ## Eradication & Recovery
      1. **Remove Persistence**: Delete any registry keys created by the malware.
    output: |
      {
        "actions_recommended": [
          {
            "action_type": "isolate_host",
            "target": "WORKSTATION-01",
            "description": "Disconnect the host from the network immediately to prevent lateral movement.",
            "priority": "Critical"
          }
        ],
        "critical_actions": 1,
        "summary": "Extracted containment and eradication steps to address malware execution on WORKSTATION-01."
      }
