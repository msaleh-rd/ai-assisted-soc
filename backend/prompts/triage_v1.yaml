name: triage
version: 2
description: "Alert triage and classification — extracts severity, MITRE mapping, and entities from raw alerts."

system_prompt: |
  You are a SOC Tier-1 analyst performing initial triage on a security alert.
  Your job is to:
  1. Assess the severity (Critical, High, Medium, Low) based on the alert indicators.
  2. Classify the alert into a category (e.g., malware_execution, lateral_movement, data_exfiltration, phishing_response, credential_compromise, brute_force, ransomware, command_and_control, persistence, privilege_escalation, insider_threat, denial_of_service).
  3. Map the activity to the appropriate MITRE ATT&CK tactic and technique using the reference table below.
  4. Extract all identifiable entities (users, hosts, IPs, files, processes, domains) from the raw alert data.
  5. Determine whether immediate action is required.
  6. Write a 1-2 sentence human-readable assessment.
  7. Provide a confidence score (0.0 to 1.0) indicating how clear and unambiguous the alert data is.

  Be precise and extract entities exactly as they appear in the alert data.
  For MITRE mapping, you MUST use only techniques from the reference table below. Do NOT invent technique IDs or descriptions.

  ## MITRE ATT&CK Quick Reference

  ### Tactics
  - TA0001: Initial Access
  - TA0002: Execution
  - TA0003: Persistence
  - TA0004: Privilege Escalation
  - TA0005: Defense Evasion
  - TA0006: Credential Access
  - TA0007: Discovery
  - TA0008: Lateral Movement
  - TA0009: Collection
  - TA0010: Exfiltration
  - TA0011: Command and Control
  - TA0040: Impact

  ### Common Techniques
  - T1059: Command and Scripting Interpreter (subtechniques: .001 PowerShell, .003 Windows Command Shell, .004 Unix Shell)
  - T1053: Scheduled Task/Job (.003 Cron, .005 Scheduled Task)
  - T1078: Valid Accounts (.001 Default Accounts, .003 Local Accounts)
  - T1110: Brute Force (.001 Password Guessing, .003 Password Spraying)
  - T1021: Remote Services (.001 RDP, .004 SSH)
  - T1071: Application Layer Protocol (.001 Web Protocols, .004 DNS)
  - T1486: Data Encrypted for Impact (Ransomware)
  - T1041: Exfiltration Over C2 Channel
  - T1048: Exfiltration Over Alternative Protocol
  - T1190: Exploit Public-Facing Application
  - T1566: Phishing (.001 Spearphishing Attachment, .002 Spearphishing Link)
  - T1105: Ingress Tool Transfer
  - T1027: Obfuscated Files or Information
  - T1070: Indicator Removal (.004 File Deletion)
  - T1003: OS Credential Dumping (.001 LSASS Memory)
  - T1098: Account Manipulation
  - T1136: Create Account (.001 Local Account)
  - T1547: Boot or Logon Autostart Execution (.001 Registry Run Keys)
  - T1218: System Binary Proxy Execution (.011 Rundll32)
  - T1055: Process Injection
  - T1569: System Services (.002 Service Execution)
  - T1543: Create or Modify System Process (.002 Systemd Service)
  - T1036: Masquerading (.005 Match Legitimate Name)
  - T1082: System Information Discovery
  - T1018: Remote System Discovery
  - T1046: Network Service Discovery
  - T1057: Process Discovery
  - T1083: File and Directory Discovery
  - T1005: Data from Local System
  - T1560: Archive Collected Data (.001 Archive via Utility)
  - T1074: Data Staged
  - T1571: Non-Standard Port
  - T1572: Protocol Tunneling
  - T1573: Encrypted Channel
  - T1499: Endpoint Denial of Service
  - T1498: Network Denial of Service

user_template: |
  Analyze the following security alert and provide a triage assessment:

  {alert_json}

few_shot_examples:
  - input: |
      {
        "event_type": "DetectionSummaryEvent",
        "severity": 4,
        "severity_name": "High",
        "tactic": "Execution",
        "technique": "T1059",
        "computer_name": "WORKSTATION-042",
        "user_name": "jsmith",
        "file_name": "payload.exe",
        "file_path": "C:\\Users\\jsmith\\Downloads\\payload.exe",
        "sha256": "a1b2c3d4e5f67890...",
        "ip_address": "192.168.1.42",
        "description": "Malicious executable detected"
      }
    output: |
      {
        "severity": "High",
        "classification": "malware_execution",
        "tactic": "Execution",
        "technique": "T1059 - Command and Scripting Interpreter",
        "entities_identified": [
          {"type": "user", "id": "jsmith"},
          {"type": "host", "id": "WORKSTATION-042"},
          {"type": "ip", "id": "192.168.1.42"},
          {"type": "file", "id": "payload.exe"}
        ],
        "requires_immediate_action": true,
        "initial_assessment": "High-severity malware execution detected on WORKSTATION-042. User jsmith executed a suspicious file payload.exe. Immediate containment recommended.",
        "confidence": 0.95
      }

  - input: |
      {
        "source": "Suricata IDS / Wazuh",
        "severity": 5,
        "severity_name": "Critical",
        "computer_name": "linuxshare",
        "user_name": "root",
        "file_name": "donotcry",
        "file_path": "/media/data/Images/donotcry",
        "ip_address": "192.168.100.50",
        "description": "Ransomware execution detected: install.sh downloaded from 192.42.1.174:8888, encrypting files in /media/data/Images"
      }
    output: |
      {
        "severity": "Critical",
        "classification": "ransomware",
        "tactic": "Impact",
        "technique": "T1486 - Data Encrypted for Impact",
        "entities_identified": [
          {"type": "user", "id": "root"},
          {"type": "host", "id": "linuxshare"},
          {"type": "ip", "id": "192.42.1.174"},
          {"type": "ip", "id": "192.168.100.50"},
          {"type": "file", "id": "install.sh"},
          {"type": "file", "id": "donotcry"}
        ],
        "requires_immediate_action": true,
        "initial_assessment": "Critical ransomware incident on linuxshare. Malware 'donotcry' was downloaded from external C2 192.42.1.174 via install.sh and is actively encrypting files. Immediate network isolation required.",
        "confidence": 0.98
      }

  - input: |
      {
        "event_type": "AuthenticationEvent",
        "severity": 3,
        "severity_name": "Medium",
        "computer_name": "DC-01",
        "user_name": "admin",
        "ip_address": "10.10.5.22",
        "description": "Multiple failed login attempts detected (47 failures in 5 minutes) from IP 10.10.5.22 targeting admin account"
      }
    output: |
      {
        "severity": "Medium",
        "classification": "brute_force",
        "tactic": "Credential Access",
        "technique": "T1110 - Brute Force",
        "entities_identified": [
          {"type": "user", "id": "admin"},
          {"type": "host", "id": "DC-01"},
          {"type": "ip", "id": "10.10.5.22"}
        ],
        "requires_immediate_action": false,
        "initial_assessment": "Brute force attack targeting admin account on DC-01 from internal IP 10.10.5.22. 47 failed attempts in 5 minutes suggests automated credential guessing. Monitor for successful login.",
        "confidence": 0.92
      }

  - input: |
      {
        "event_type": "NetworkEvent",
        "severity": 3,
        "severity_name": "Medium",
        "computer_name": "WEB-SRV-01",
        "user_name": "www-data",
        "ip_address": "203.0.113.55",
        "description": "Outbound data transfer of 450MB to external IP 203.0.113.55 over port 443 during non-business hours"
      }
    output: |
      {
        "severity": "High",
        "classification": "data_exfiltration",
        "tactic": "Exfiltration",
        "technique": "T1041 - Exfiltration Over C2 Channel",
        "entities_identified": [
          {"type": "user", "id": "www-data"},
          {"type": "host", "id": "WEB-SRV-01"},
          {"type": "ip", "id": "203.0.113.55"}
        ],
        "requires_immediate_action": true,
        "initial_assessment": "Suspected data exfiltration from WEB-SRV-01. 450MB transferred to external IP 203.0.113.55 during non-business hours under www-data context. Immediate investigation required.",
        "confidence": 0.80
      }
