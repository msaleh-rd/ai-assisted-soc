services:
  # FastAPI application
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://soc_user:soc_password@postgres:5432/soc_platform
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=soc_password
      - LOG_LEVEL=info
      - USE_TEMPORAL=true
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
    depends_on:
      - postgres
      - neo4j
      - redis
      - temporal
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Temporal Worker (runs investigation workflows)
  temporal-worker:
    build: .
    environment:
      - TEMPORAL_HOST=temporal:7233
      - TEMPORAL_NAMESPACE=default
      - LOG_LEVEL=info
    depends_on:
      temporal:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: python -m backend.services.temporal_worker
    restart: on-failure:5

  # ---------------------------------------------------------------
  # Temporal Infrastructure
  # ---------------------------------------------------------------

  # PostgreSQL for Temporal persistence (separate from SOC DB)
  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    networks:
      - default
    volumes:
      - temporal_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Temporal admin-tools (DB schema setup)
  temporal-admin-tools:
    image: temporalio/admin-tools:1.31.0
    container_name: temporal-admin-tools
    restart: on-failure:6
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - SQL_PASSWORD=temporal
    entrypoint: ["/bin/sh"]
    command: ["-c", "temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal create && temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal setup-schema -v 0.0 && temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal update-schema -d /etc/temporal/schema/postgresql/v12/temporal/versioned && temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal_visibility create && temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal_visibility setup-schema -v 0.0 && temporal-sql-tool --plugin postgres12 --ep temporal-postgresql -u temporal -pw temporal -p 5432 --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v12/visibility/versioned && echo 'Schema setup complete'"]

  # Temporal Server
  temporal:
    image: temporalio/server:1.31.0
    container_name: temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  # Temporal Web UI
  temporal-ui:
    image: temporalio/ui:2.49.1
    container_name: temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------
  # SOC Platform Infrastructure
  # ---------------------------------------------------------------

  # PostgreSQL database (SOC platform data)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=soc_platform
      - POSTGRES_USER=soc_user
      - POSTGRES_PASSWORD=soc_password
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j graph database
  neo4j:
    image: neo4j:5.14-community
    environment:
      - NEO4J_AUTH=neo4j/soc_password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p soc_password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  temporal_pg_data:
